# See docs at: https://mystmd.org/guide/frontmatter
version: 1
extends:
  - https://raw.githubusercontent.com/projectpythia/pythia-config/main/pythia.yml
project:
  title: ICESat-2 Cookbook
  github: https://github.com/ICESAT-2HackWeek/icesat2-cookbook
  authors:
    - name: ICESat-2 team
  copyright: '2025'
  references:
    awesome: https://icesat-2.github.io/awesome-icesat2
    cryocloud: https://book.cryointhecloud.com
  toc:
    - file: README.md
    - title: Preamble
      children:
        - file: notebooks/governance.ipynb
        - file: notebooks/contributing.ipynb
        - file: notebooks/engagement.ipynb
        - file: notebooks/how-to-cite.md
    - title: Foundations
      children:
        - file: notebooks/mission-overview.ipynb
        - file: notebooks/filtering.ipynb
        - file: notebooks/geospatial-transforms.ipynb
        - file: notebooks/visualization.ipynb
    - title: Example Workflows
      children:
        - file: notebooks/land-ice.ipynb
        - file: notebooks/snowdepth.ipynb
    - title: Additional Resources
      children:
        - file: additional-resources/awesome.md
        - file: additional-resources/cryocloud.md
  jupyter:
      binder:
        url: https://hub.cryointhecloud.com
        provider: github
        repo: ICESAT-2HackWeek/icesat2-cookbook
error_rules:
  - rule: link-resolves
    severity: ignore
    keys:
      - 'https://doi.org/**'
      - 'https://zenodo.org/**'
      - 'https://www.neonscience.org/**'
      - 'https://onlinelibrary.wiley.com/**'
      - 'https://agupubs.onlinelibrary.wiley.com/**'
  - rule: doi-link-valid
    severity: ignore
    keys:
      - 'https://zenodo.org/**'
      - 'https://doi.org/**'
